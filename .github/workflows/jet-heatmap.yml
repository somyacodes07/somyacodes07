name: Update Minecraft Profile & Contribution SVGs

on:
  schedule:
    # Runs daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "profile.config.json"
      - "generate.mjs"
      - "profile.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify profile generator
        run: npm test

      - name: Generate live Minecraft profile and contribution heatmap
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node generate.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live profile cards and jet heatmap [skip ci]"
          file_pattern: "dist/github-jet.svg github-jet.svg dark.svg light.svg"
